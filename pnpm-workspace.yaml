packages:
  - packages/*

# pnpm 10 blocks dependency lifecycle scripts by default; allowlist per package.
# - bun: devDep; its postinstall downloads the bun binary used by build:*
# - esbuild: bundles the lazily installed cli-* packages (scripts/publish-npm.mjs)
onlyBuiltDependencies:
  - bun
  - esbuild
